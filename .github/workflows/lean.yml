name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan and Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate Lake manifest
        run: lake update
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build
        run: lake build
      - name: Axiom audit
        run: lake env lean AxiomAudit.lean
      - name: Source trust scan
        run: |
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit|native_decide)([^[:alnum:]_]|$)' Jsp001007Lean AxiomAudit.lean; then
            echo "Forbidden proof shortcut found"
            exit 1
          fi
