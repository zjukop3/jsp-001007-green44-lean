name: Lean

on:
  push:
  workflow_dispatch:

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan and Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate Lake manifest
        run: lake update
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build prime table only
        run: lake build Jsp001007Lean.PrimeData
      - name: Benchmark strict monotonicity with decide
        run: lake env lean StrictDecideSmoke.lean
