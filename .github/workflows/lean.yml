name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan and Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate Lake manifest
        run: lake update
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build local table module
        run: lake build Jsp001007Lean.PrimeData
      - name: Benchmark 999 adjacent inequalities
        run: lake env lean StructSmoke.lean
